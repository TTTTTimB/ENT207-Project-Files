统文化的传承与创新，为追求品质生活的你，带来一场文化与美的邂逅\n\nTaoxia embodies the sweetness and vitality of summer. We value the cultural connotation of our products and adhere to the philosophy of \"Warmth, Care, Humanity\". We integrate traditional cultural elements into our designs, turning every Taoxia hand cream into an exquisite cultural and creative gift. While nourishing and caring for your hands, you can also experience the inheritance and innovation of traditional culture, bringing you an encounter between culture and beauty as you pursue a quality life.\n","source":"官网地图"},"s_3ce8ada8cc949951":{"name":"Lavazza","description":"意式浓缩咖啡和顺滑牛奶的经典组合，牛奶和咖啡恰到好处的平衡，温顺醇厚！\r\n","position":"GF37","phone":"18121417091","type":"fnb","source":"官网商户资料"},"s_e3d3cc53689d4a6c":{"description":"Shanghai Zhenghai is a restaurant specializing in small bowl exquisite dishes. The dishes in the restaurant include local cuisine, Cantonese cuisine, Hunan cuisine, street food and other styles! It integrates modern elements and innovation. The ingredients are fresh and the taste is authentic. Diversified choices to meet the needs of different diners. The Hushang Zhenghai team, having received professional training, is warm and considerate in their attitude, and is committed to creating a high-quality Chinese cuisine experience for customers!","source":"官网地图"},"s_2f2658891b87d8b4":{"description":"B.U.T.ESSE是专研定制护肤美容品牌，为台湾东森集团旗下高端品牌，是科技与自然的极致融合、更是撕破标签、颠覆传统护肤美学的先锋精神。在科技与灵性共振处栖居，                                               B.U.T ESSE生活馆，一间为你提供量肤定制，身心滋养的一方疗愈空间，在这里，您可以放下嘈杂，享受B.U.TESSE的沁心疗愈环境，沉静式的感受肌肤奇妙变化，在每一次体验中，聆听肌肤的呼吸，与之对话，看见由内而外透出的健康自然的本真之美！\nB.U.T.ESSE is a specialized customized skincare and beauty brand, an upscale label under Taiwan's EBC Group. It represents the perfect fusion of technology and nature, embodying a pioneering spirit that shatters conventions and redefines traditional skincare aesthetics. Nestled at the intersection of science and spirituality,   the B.U.T ESSE Living Room offers a sanctuary for personalized skincare and holistic wellness. Here, you can leave behind the noise and immerse yourself in B.U.TESSE's refreshing therapeutic environment, quietly witnessing your skin's remarkable transformation. With each experience, you'll listen to your skin's breath, converse with it, and discover the authentic beauty that radiates from within—a harmonious blend of health and natural vitality!\n\n","source":"官网地图"},"s_9e86f7d2ca0e07f1":{"description":"The most beautiful flavor of Wuhan. Chuhan Legend specializes in authentic Wuhan hot dry noodles and its soulful handcrafted three-ingredient bean curd sheets. It adheres to the selection of high-quality ingredients and focuses on the original intention of flavor","source":"官网地图"},"s_22c776b3029c7787":{"description":"711便利店，精选零食、热饮冷饮、速食便当、日用百货，满足您随时所需，便捷就在身边\n\n711 Convenience Store offers a selection of snacks, hot and cold drinks, instant bento boxes, and daily necessities, meeting your needs at any time. Convenience is right beside you.","source":"官网地图"},"s_f29083d8f5c077fd":{"description":"黄油&渔是高端海鲜休闲零食品牌。\nButter & Fish is a premium seafood snack brand.\n","source":"官网地图"},"s_bf8e20b9223d8095":{"description":"","source":"官网地图"},"s_1f71fc9fa2cc7b43":{"description":"手机虾是一家线下连锁数码配件品牌，主营手机壳、手机贴膜的销售及相关会员服务，在全国多个城市的商场设有门店，提供多种型号的手机保护壳及高清、防窥等功能性贴膜。\n","source":"官网地图"},"s_dfa2bb86ee926977":{"description":"","source":"官网地图"},"s_f0fdd63d66852edf":{"description":"\"Freshly stir-fried dishes, once covered, are soul-stirring\n\"\"Gaima rice\"\" is the soul of modern fast food, emphasizing freshly stir-fried, hot-served and quick consumption.\nYue Xiang Yu specializes in Hunan-style covered rice, perfectly combining authentic stir-fried dishes with rice.\nLet the busy you also be able to \"\"enjoy all the flavors of Hunan in one bowl\"\"\"\n","source":"官网地图"},"s_ce4df6a0bee40036":{"description":"\"Freshly stir-fried dishes, once covered, are soul-stirring\n\"\"Gaima rice\"\" is the soul of modern fast food, emphasizing freshly stir-fried, hot-served and quick consumption.\nYue Xiang Yu specializes in Hunan-style covered rice, perfectly combining authentic stir-fried dishes with rice.\nLet the busy you also be able to \"\"enjoy all the flavors of Hunan in one bowl\"\"\"\n","source":"官网地图"},"s_4dc54b5149427315":{"description":"满巍明生炸鸡架品牌创立于2020年，秘制配方颠覆传统，不裹粉新鲜炸，口味焦香回甜。全系鸡肉源自世界 500 强供应链，凭特色生炸优势火速席卷全国\nThe Manwei Mingsheng fried chicken rack brand was established in 2020. Its secret recipe breaks the traditional mold. Freshly fried without coating, it has a crispy, fragrant and sweet taste. All the chicken is sourced from the supply chain of the world's top 500 companies and has quickly swept across the country with its unique advantage of being freshly fried","source":"官网地图"},"s_9584058652a8896b":{"description":"The brand of homemade chocolate allows you to experience a different almond flavor and sweet taste","source":"官网地图"},"s_30ac68691d87f4f8":{"description":"苏小柳（SUE DIM SUM），扎根于上海，致力于打造具有现代气息与传统底蕴的江南点心品牌。我们以“食安大于天”为准则，坚持自然本味与高品质食材，将江南风物与时令之美融入一笼一饺、一饼一汤之中，为每一位食客呈现“一种味道，一个江南”的舌尖意境。\nSUE DIM SUM, rooted in Shanghai, is committed to creating a Jiangnan pastry brand that combines modernity with traditional heritage. We adhere to the principle that \"food safety is of Paramount importance\", insisting on natural flavors and high-quality ingredients. We incorporate the beauty of Jiangnan's local customs and seasonal delights into every steamer, dumpling, pancake and soup, presenting to every diner the taste of \"one flavor, one Jiangnan\".\n","source":"官网地图"},"s_83f9379038d93079":{"description":"This pair of \"golden partners\" from the earth completed their predestined encounter at Pang Qiu Shu's place. The sweet party and the salty party don't have to fight. \"Sweet potato Meet potato, double potatoes make you more satisfied!\"","source":"官网地图"},"s_22cff3f7b56df723":{"description":"各式烧鸟、日式小吃、拉面、中华炒物、烤鱼炸串，将日式美味一网打尽。All kinds of roasted birds, Japanese snacks, Lamian Noodles, Chinese frie       const f=floors[i],p=project([0,0],i),isActive=num(f)===activeFloor;
      const opacity=activeFloor===null?.7:isActive?1:.2;
      content+='<g class="floor-layer '+(isActive?'active':'')+'" data-floor="'+num(f)+'" opacity="'+opacity+'" transform="matrix('+[a,b,c,d,...p].map(round).join(' ')+')"><path class="floor-shell" d="'+f.shell+'"/>'+f.spaces.map(s=>'<path class="room '+esc(s.kind)+(selectedShop===s.id?' shop-selected':'')+'" '+((s.name||s.externalId)?'data-shop="'+s.id+'"':'')+' d="'+s.path+'"><title>'+esc(s.name||s.externalId||'区域')+'</title></path>').join('')+'</g>';
    }
    // Every stop is projected from its true point; displayPoint is intentionally unused.
    const selectedConnection=connections.get(selected);
    if(selectedConnection&&tilt!==90){
      const stops=selectedConnection.stops.map(s=>project(s.point,s.index)),color=selectedConnection.type==='elevator'?'#197d83':'#bf8639';
      content+='<path class="connection-line" stroke="white" stroke-width="5" opacity=".85" d="'+stops.map((p,i)=>(i?'L':'M')+p.map(round).join(' ')).join(' ')+'"/>';
      content+='<path class="connection-line" stroke="'+color+'" stroke-width="2.2" stroke-dasharray="4 4" d="'+stops.map((p,i)=>(i?'L':'M')+p.map(round).join(' ')).join(' ')+'"/>';
    }
    for(let i=0;i<floors.length;i++){
      if(tilt===90&&num(floors[i])!==activeFloor)continue;
      const f=floors[i],lp=project([500,325],i),labelX=Math.max(27,centerX-extentX*scale/2-24),isActive=num(f)===activeFloor;
      const labelY=tilt===90?80:project([500,325],6)[1]+(6-i)*Math.max(26,layerGap*scale);
      if(tilt!==90&&Math.abs(labelY-lp[1])>1)content+='<path d="M'+round(labelX+20)+' '+round(labelY)+' L'+round(labelX+29)+' '+round(lp[1])+'" fill="none" stroke="#b4c9bd" stroke-width=".7"/>';
      content+='<g class="floor-label '+(isActive?'active':'')+'" data-floor="'+num(f)+'" role="button" tabindex="0" aria-label="高亮'+label(num(f))+'" transform="translate('+round(labelX)+' '+round(labelY)+')"><rect x="-20" y="-12" width="40" height="24" rx="7"/><text>'+label(num(f))+'</text></g>';
      for(const m of f.facilities){
        const chosen=m.info.connectionId===selected;
        if(!chosen&&activeFloor!==null&&!isActive)continue;
        const p=project(m.point,i),color=m.type==='elevator'?'#287f84':'#c28d45';
        const radius=chosen?5.5:2.6,opacity=chosen?1:.65;
        content+='<g class="marker '+(chosen?'selected':'')+'" data-connection="'+m.info.connectionId+'" data-stop="'+num(f)+'" role="button" tabindex="'+(chosen||isActive?'0':'-1')+'" aria-label="'+esc(connections.get(m.info.connectionId).displayName)+'，'+label(num(f))+'" transform="translate('+p.map(round).join(' ')+')" opacity="'+opacity+'"><circle r="'+radius+'" fill="'+color+'"/>'+(chosen?'<text>'+(m.type==='elevator'?'E':'S')+'</text>':'')+'</g>';
      }
    }
    if(showNames&&activeFloor!==null&&tilt>0){
      const occupied=[];
      for(const s of merchants.filter(s=>s.floor===activeFloor).sort((a,b)=>Number(b.id===selectedShop)-Number(a.id===selectedShop))){
        const p=project(s.center,s.index),name=s.info.name||s.name||s.externalId,short=name.length>18?name.slice(0,17)+'…':name,w=Math.min(150,short.length*6+14),chosen=s.id===selectedShop;
        if(!chosen&&occupied.some(q=>Math.abs(q.x-p[0])<(q.w+w)/2+3&&Math.abs(q.y-p[1])<22))continue;
        if(p[0]-w/2<0||p[0]+w/2>width||p[1]<70||p[1]>height-35)continue;
        occupied.push({x:p[0],y:p[1],w});
        content+='<g class="shop-label '+(chosen?'selected':'')+'" transform="translate('+p.map(round).join(' ')+')"><rect x="'+(-w/2)+'" y="-9" width="'+w+'" height="18" rx="4"/><text>'+esc(short)+'</text></g>';
      }
    }
    svg.innerHTML=content;$('hover').hidden=true;controls();
  }
  function selectShop(id){const s=merchants.find(x=>x.id===id);if(!s)return;selectedShop=id;selected=null;activeFloor=s.floor;draw();details();list();merchantList();}
  function select(id){selectedShop=null;selected=id;type=connections.get(id).type;if(tilt===90&&!connections.get(id).info.connectedFloors.includes(activeFloor))activeFloor=connections.get(id).info.connectedFloors[0];draw();details();list();merchantList();}
  function selectFloor(n){activeFloor=n==='all'?null:Number(n);if(n==='all'&&tilt===90)tilt=24;selectedShop=null;draw();details();merchantList();}
  function reset(){yaw=-18;tilt=24;gap=76;zoom=1;pan=[0,0];activeFloor=null;selectedShop=null;draw();details();merchantList();}
  function changeZoom(amount){zoom=Math.min(2.8,Math.max(.65,zoom*amount));draw();}
  $('floor-buttons').onclick=e=>{const b=e.target.closest('[data-floor]');if(b)selectFloor(b.dataset.floor);};
  $('details').onclick=e=>{const b=e.target.closest('[data-floor]');if(b)selectFloor(b.dataset.floor);else if(e.target.closest('#clear')){selected=selectedShop=null;draw();details();list();merchantList();}else if(e.target.closest('#shop-plan')){tilt=90;zoom=1;pan=[0,0];draw();details();merchantList();}};
  $('merchant-list').onclick=e=>{const b=e.target.closest('[data-shop]');if(b)selectShop(b.dataset.shop);};
  $('merchant-search').oninput=merchantList;
  $('show-names').onchange=e=>{showNames=e.target.checked;draw();};
  $('plan-view').onclick=()=>{tilt=90;zoom=1;pan=[0,0];draw();details();merchantList();};
  $('side-view').onclick=()=>{tilt=0;draw();details();merchantList();};
  $('facility-list').onclick=e=>{const b=e.target.closest('[data-connection]');if(b)select(b.dataset.connection);};
  document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;list();});
  for(const id of ['gap','tilt','rotation'])$(id).oninput=e=>{const value=Number(e.target.value);if(id==='gap')gap=value;else if(id==='tilt')tilt=value;else yaw=value;draw();details();merchantList();};
  $('zoom-in').onclick=()=>changeZoom(1.2);$('zoom-out').onclick=()=>changeZoom(1/1.2);$('reset').onclick=reset;
  function activate(e){const m=e.target.closest('[data-connection]'),s=e.target.closest('[data-shop]');if(m)select(m.dataset.connection);else if(s)selectShop(s.dataset.shop);else{const f=e.target.closest('[data-floor]');if(f)selectFloor(f.dataset.floor);}}
  svg.addEventListener('click',e=>{if(ignoreClick){ignoreClick=false;return;}activate(e);});
  svg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const marker=e.target.closest('[data-connection]'),floor=e.target.closest('[data-floor]');const selector=marker?'[data-connection="'+marker.dataset.connection+'"][data-stop="'+marker.dataset.stop+'"]':floor?'.floor-label[data-floor="'+floor.dataset.floor+'"]':null;activate(e);if(selector)svg.querySelector(selector)?.focus();}else if(e.key==='Escape'){selected=selectedShop=null;draw();details();list();merchantList();}else if(e.key==='+'||e.key==='=')changeZoom(1.2);else if(e.key==='-')changeZoom(1/1.2);});
  svg.addEventListener('wheel',e=>{e.preventDefault();changeZoom(Math.exp(-e.deltaY*.001));},{passive:false});
  svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,yaw,tilt,pan:[...pan],shift:e.shiftKey};moved=false;});
  svg.addEventListener('pointermove',e=>{
    if(drag&&drag.id===e.pointerId){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4){moved=true;svg.setPointerCapture(e.pointerId);svg.classList.add('dragging');if(drag.shift)pan=[drag.pan[0]+dx,drag.pan[1]+dy];else{yaw=Math.round(((drag.yaw+dx*.4+540)%360)-180);tilt=Math.round(Math.max(0,Math.min(90,drag.tilt-dy*.2)));}draw();merchantList();}return;}
    const marker=e.target.closest('[data-connection]'),hover=$('hover');if(!marker){hover.hidden=true;return;}
    const conn=connections.get(marker.dataset.connection);hover.innerHTML='<b>'+esc(conn.displayName)+' · '+label(Number(marker.dataset.stop))+'</b><br>'+esc(conn.info.lines[1]);hover.hidden=false;
    const box=svg.getBoundingClientRect();hover.style.left=Math.max(8,Math.min(width-hover.offsetWidth-8,e.clientX-box.left+12))+'px';hover.style.top=Math.max(64,Math.min(height-hover.offsetHeight-12,e.clientY-box.top-hover.offsetHeight-12))+'px';
  });
  function end(e){if(!drag||drag.id!==e.pointerId)return;if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);ignoreClick=moved;drag=null;svg.classList.remove('dragging');details();}
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);svg.addEventListener('pointerleave',()=>{$('hover').hidden=true;});
  new ResizeObserver(draw).observe(svg);window.addEventListener('pageshow',reset);
  draw();details();list();merchantList();
})();</script></body></html>
